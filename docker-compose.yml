services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sysbot
      POSTGRES_PASSWORD: sysbot
      POSTGRES_DB: sysbot
    ports:
      - "5441:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysbot -d sysbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  nocodb:
    image: nocodb/nocodb:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NC_DB: "pg://postgres:5432?u=sysbot&p=sysbot&d=nocodb"
    volumes:
      - ncdata:/usr/app/data

  seed:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: ["python", "scripts/seed_db.py"]
    restart: "no"

  sysbot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # ponytail: sin este cap, workers=cpu*2+1 (=65 en host de 32 cores) abre
      # más pools que max_connections de Postgres (100) -> "too many clients".
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      ESPOCRM_URL: http://espocrm
      ESPOCRM_API_KEY: ${ESPOCRM_API_KEY:-}
      FIREBIRD_HOST: firebird
    networks:
      - default
      - sysplus-demo
    volumes:
      - ./token.json:/app/token.json

networks:
  default:
  sysplus-demo:
    external: true

volumes:
  pgdata:
  ncdata:
