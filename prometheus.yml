global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'demobot-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

rule_files:
  - 'prometheus-rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'demobot-app'
    static_configs:
      - targets: ['app:8000', 'sysbot:8000']
    scrape_interval: 15s
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: 'demobot-postgres'
    static_configs:
      - targets: ['db:5432']
    scrape_interval: 30s

  - job_name: 'demobot-nginx'
    static_configs:
      - targets: ['nginx:80']
    scrape_interval: 15s
