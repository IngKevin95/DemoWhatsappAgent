apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: true

  - name: PostgreSQL
    type: postgres
    url: postgres:5432
    user: sysbot
    secureJsonData:
      password: sysbot
    jsonData:
      database: sysbot
      sslmode: disable
    editable: true
