groups:
  - name: demobot_alerts
    interval: 15s
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "P99 latency > 5s for 5+ minutes on {{ $labels.instance }}"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate > 1% for 5+ minutes on {{ $labels.instance }}"

      - alert: AppDown
        expr: up{job="demobot-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Application is down"
          description: "DemoBot app has been down for > 1 minute"

      - alert: DatabaseDown
        expr: up{job="demobot-postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database is down"
          description: "PostgreSQL has been down for > 1 minute"

      - alert: HighRateLimitTriggered
        expr: rate(rate_limit_triggers_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rate limiting being triggered"
          description: "Rate limit triggers > 0.5/sec for 5+ minutes on {{ $labels.instance }}"

      - alert: LowUptime
        expr: demobot_uptime_seconds < 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Application restarted recently"
          description: "Uptime < 5 minutes on {{ $labels.instance }}"

      - alert: DependencyDegraded
        expr: demobot_dependency_health{status!="ok"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dependency degraded: {{ $labels.dependency }}"
          description: "{{ $labels.dependency }} has been degraded for > 5 minutes"
