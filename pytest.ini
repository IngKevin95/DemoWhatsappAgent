[pytest]
asyncio_mode = auto
python_files = test_*.py *_test.py
testpaths = tests
markers =
    unit: tests unitarios (sin red, mocks puros)
    integration: tests con mocks de servicios externos
    e2e: webhook end-to-end, flujos completos

addopts =
    --cov=agent
    --cov-report=html
    --cov-report=term-missing
    -v
