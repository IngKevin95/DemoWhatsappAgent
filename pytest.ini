[pytest]
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    --cov=agent
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=60
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    integration: marks tests as integration tests
    slow: marks tests as slow
testpaths = tests
